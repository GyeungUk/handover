# PostgreSQL for local development. Start it before `./gradlew bootRun`:
#   docker compose up -d
# Flyway creates the schema on the application's first start, so nothing else is needed here.
services:
  postgres:
    image: postgres:16-alpine
    container_name: handover-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-handover}
      POSTGRES_USER: ${POSTGRES_USER:-handover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handover}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - handover-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handover} -d ${POSTGRES_DB:-handover}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  handover-postgres-data:
