plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.globalaffairs'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Sends the "비밀번호 찾기" code. Without `spring.mail.host` no sender is created and the
    // password-reset endpoint answers 503 rather than dropping the message; see PasswordResetMailer.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Integration tests that need a real PostgreSQL bring their own container.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()

    // Docker Engine 29 dropped every API version below 1.44, but the docker-java shipped with
    // Testcontainers still negotiates 1.32. The daemon answers its probe with a 400 and
    // Testcontainers reports "no valid Docker environment" on a perfectly healthy Docker, silently
    // skipping every @EnabledIf("dockerAvailable") test. Pinning 1.44 — supported since Docker 25
    // (2024) — makes the container tests run without each developer exporting anything.
    // Set DOCKER_API_VERSION to override, e.g. for a daemon older than 25.
    systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
