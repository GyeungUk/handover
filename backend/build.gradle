plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.globalaffairs'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Integration tests that need a real PostgreSQL bring their own container.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()

    // Docker Engine 29 rejects the API version docker-java negotiates by default, which makes
    // Testcontainers report "no valid Docker environment" on an otherwise healthy daemon. Export
    // DOCKER_API_VERSION (e.g. 1.44) to pin one; leave it unset on older daemons.
    if (System.getenv('DOCKER_API_VERSION')) {
        systemProperty 'api.version', System.getenv('DOCKER_API_VERSION')
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
