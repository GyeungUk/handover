name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts a real PostgreSQL 16 for the Flyway and API integration tests.
      # Docker is preinstalled on the runner, so those tests must not be skipped here.
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Fail if container tests were skipped
        working-directory: backend
        run: |
          reports=(
            build/test-results/test/TEST-com.globalaffairs.handover.db.ApiIntegrationTest.xml
            build/test-results/test/TEST-com.globalaffairs.handover.db.AuthApiIntegrationTest.xml
            build/test-results/test/TEST-com.globalaffairs.handover.db.FlywayMigrationTest.xml
          )
          skipped=$(grep -ho 'skipped="[0-9]*"' "${reports[@]}" \
            | grep -o '[0-9]*' | awk '{total += $1} END {print total + 0}')
          echo "skipped container tests: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped container test(s) were skipped — Docker-backed tests must run in CI."
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  domain-data:
    name: Domain data in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The JSON the Spring backend reads is generated from the TypeScript sources. If someone edits
      # the org chart without re-running the exporter, the two backends serve different data.
      - name: Regenerate exported resources
        run: |
          node backend/tools/export-domain-data.mjs
          node backend/tools/export-prompts.mjs

      - name: Fail if the generated files are stale
        run: |
          if ! git diff --quiet -- backend/src/main/resources; then
            echo "::error::backend/src/main/resources is out of date. Run the exporters and commit the result:"
            echo "  node backend/tools/export-domain-data.mjs"
            echo "  node backend/tools/export-prompts.mjs"
            git diff --stat -- backend/src/main/resources
            exit 1
          fi
